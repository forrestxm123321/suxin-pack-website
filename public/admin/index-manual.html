<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>内容管理后台 — 塑鑫包装</title>
  <style>
    body { margin: 0; background: #f1f5f9; font-family: system-ui, sans-serif; }
    #debug { position: fixed; bottom: 0; left: 0; right: 0; max-height: 40vh;
      background: #1e293b; color: #e2e8f0; font: 11px monospace;
      overflow-y: auto; padding: 10px 14px; z-index: 99999;
      border-top: 2px solid #f59e0b; }
    .err { color: #f87171; } .warn { color: #fbbf24; }
    .info { color: #60a5fa; } .ok { color: #4ade80; }
  </style>
</head>
<body>
  <div id="nc-root"></div>
  <div id="debug"></div>

  <script>
    var logs = [];
    function log(msg, cls) {
      cls = cls || 'info';
      var t = new Date().toLocaleTimeString();
      logs.push('<span class="' + cls + '">[' + t + '] ' + msg + '</span>');
      document.getElementById('debug').innerHTML = logs.join('<br>');
      console.log('[CMS]', msg);
    }

    window.onerror = function(m, u, l, c, e) {
      log('JS ERROR: ' + m + ' @ ' + u + ':' + l, 'err');
    };
    window.addEventListener('unhandledrejection', function(e) {
      log('PROMISE: ' + (e.reason ? e.reason.message || String(e.reason) : '?'), 'err');
    });

    log('Page loaded, waiting for CMS script...', 'info');
  </script>

  <!-- Try Decap CMS v3 - manual init -->
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
  <script>
    log('Script loaded', 'ok');

    var CMS = window.CMS || window.DecapCms;
    if (!CMS) {
      log('FATAL: CMS global not found! window.CMS=' + typeof window.CMS + ' window.DecapCms=' + typeof window.DecapCms, 'err');
    } else {
      log('CMS found, keys: ' + Object.keys(CMS).slice(0,15).join(', '), 'ok');

      if (typeof CMS.init === 'function') {
        log('CMS.init available, calling with manual config...', 'info');
        try {
          CMS.init({
            config: {
              backend: {
                name: 'github',
                repo: 'forrestxm123321/suxin-pack-website',
                branch: 'main',
                base_url: 'https://suxin-pack.pages.dev',
                auth_endpoint: 'auth'
              },
              media_folder: 'public/images/uploads',
              public_folder: '/images/uploads',
              locale: 'zh_Hans',
              site_url: 'https://suxin-pack.pages.dev',
              display_url: 'https://suxin-pack.pages.dev',
              collections: []
            }
          });
          log('CMS.init() called successfully', 'ok');
        } catch(e) {
          log('CMS.init() error: ' + e.message, 'err');
          if (e.stack) log('Stack: ' + e.stack, 'err');
        }
      } else {
        log('CMS.init not a function!', 'err');
      }
    }

    // Check after 3 seconds
    setTimeout(function() {
      var root = document.getElementById('nc-root');
      log('3s check: nc-root children=' + (root ? root.children.length : 'null'), 'info');
      if (root && root.children.length === 0) {
        log('CMS did not render anything into nc-root', 'warn');
      }
    }, 3000);

    // Check after 10 seconds
    setTimeout(function() {
      var root = document.getElementById('nc-root');
      log('10s check: nc-root children=' + (root ? root.children.length : 'null'), 'info');
      if (root && root.children.length > 0) {
        log('CMS rendered! HTML snippet: ' + root.innerHTML.substring(0, 300), 'ok');
      }
    }, 10000);
  </script>
</body>
</html>
